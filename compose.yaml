name: orderflow

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "git config --global --add safe.directory /var/www/html
      && composer install --no-interaction --prefer-dist
      && php artisan migrate --force
      && if [ ! -f storage/app/keys/jwt-private.pem ]; then php artisan identity:generate-jwt-keys; fi
      && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:${APP_PORT:-8000}
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_DATABASE: orderflow
      DB_HOST: postgres
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: orderflow
      RABBITMQ_USER: orderflow
      SESSION_DRIVER: redis
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work database --queue=outbox,notifications,default --sleep=1 --tries=1 --timeout=20 --max-time=3600
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_DATABASE: orderflow
      DB_HOST: postgres
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow
      QUEUE_CONNECTION: database
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: orderflow
      RABBITMQ_USER: orderflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_DATABASE: orderflow
      DB_HOST: postgres
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  message-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan messaging:consume order-payment-status
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_DATABASE: orderflow
      DB_HOST: postgres
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: orderflow
      RABBITMQ_USER: orderflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan messaging:consume notification-user-registered
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      DB_CONNECTION: pgsql
      DB_DATABASE: orderflow
      DB_HOST: postgres
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PASSWORD: orderflow
      RABBITMQ_USER: orderflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_USER: orderflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_PASS: orderflow
      RABBITMQ_DEFAULT_USER: orderflow
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  composer_vendor:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${ORDERFLOW_SUBNET:-172.31.240.0/24}
