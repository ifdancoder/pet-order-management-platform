name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, pdo_sqlite

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: composer analyse

  tests:
    name: Unit, feature, and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, openssl, pdo_sqlite

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan identity:generate-jwt-keys --no-interaction

      - name: Run tests
        run: php artisan test --compact

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_DATABASE: orderflow_test
      DB_HOST: 127.0.0.1
      DB_PASSWORD: orderflow
      DB_PORT: 5432
      DB_USERNAME: orderflow

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: orderflow_test
          POSTGRES_PASSWORD: orderflow
          POSTGRES_USER: orderflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, pdo_pgsql

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Run integration tests
        run: composer test:integration
